name: build

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, name: linux-amd64 }
          - { goos: linux,   goarch: arm64, name: linux-arm64 }
          - { goos: windows, goarch: amd64, name: windows-amd64, ext: ".exe" }
          - { goos: darwin,  goarch: arm64, name: darwin-arm64 }
          - { goos: darwin,  goarch: amd64, name: darwin-amd64 }
          - { goos: android, goarch: arm64, name: android-arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 模块代理偶发 "stream error / INTERNAL_ERROR"（HTTP2 抖动）时，
      # go 命令不会自动切到 GOPROXY 列表里的下一个镜像（只在 404/410 才切），
      # 所以这里必须自己重试，否则整个 matrix job 直接红。
      - name: Build ${{ matrix.name }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOTOOLCHAIN: local
        run: |
          for attempt in 1 2 3 4; do
            echo "::group::build attempt ${attempt}/4 (${{ matrix.name }})"
            if go build -trimpath -ldflags="-s -w" -o vproxy${{ matrix.ext }} ./cmd/vproxy; then
              echo "::endgroup::"
              echo "build ok on attempt ${attempt}"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt ${attempt} failed (transient module-proxy error?), retry in 15s"
            sleep 15
          done
          echo "::error::all 4 build attempts failed"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: vproxy-${{ matrix.name }}
          path: vproxy${{ matrix.ext }}
          if-no-files-found: error
